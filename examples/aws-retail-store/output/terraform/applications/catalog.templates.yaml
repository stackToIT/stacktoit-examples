# TEMPLATE of the environment and secrets of catalog (applications/catalog.templates.yaml): NAMES ONLY.
# Written from the application compatibility contract applications/catalog.json, which says for every key where its value comes from and what to do.
# No string value is copied from the source, except a key marked DERIVED (the name and port of a Service of this manifest set): an environment value can carry a secret under any name, so each other key holds a REQUIRED_ placeholder that you
# replace with the value the running service uses (a secret from your own secret store, never from this file or the repository).
# Not listed below: RETAIL_CATALOG_SEARCH_ENABLED — a number under a quantity name or true/false, which the ConfigMap catalog-env of the manifest already copies from the source; those keys are in the ConfigMap, not here.
# StackToIT applies nothing: this is a list of what to create, bound to the manifest kubernetes/catalog/manifests.yaml, which reads these keys.
---
# This is a LIST of keys, not the ConfigMap the pods read: the pods read catalog-env, which kubernetes/catalog/manifests.yaml defines (its data holds the keys it copies). Put each key below,
# with its value, into the data of that ConfigMap. It carries another name so that no file but the manifest owns catalog-env: two files that define one ConfigMap delete each other's keys at the next kubectl apply.
apiVersion: v1
kind: ConfigMap
metadata:
  name: catalog-env-keys
data:
  RETAIL_CATALOG_PERSISTENCE_DB_NAME: "REQUIRED_CATALOG_ENV_RETAIL_CATALOG_PERSISTENCE_DB_NAME" # LITERAL: set the value the running service uses (not copied from the source)
  RETAIL_CATALOG_PERSISTENCE_PROVIDER: "REQUIRED_CATALOG_ENV_RETAIL_CATALOG_PERSISTENCE_PROVIDER" # LITERAL: set the value the running service uses (not copied from the source)
  RETAIL_CATALOG_SEARCH_OS_ENDPOINT: "REQUIRED_CATALOG_ENV_RETAIL_CATALOG_SEARCH_OS_ENDPOINT" # NOT_VISIBLE: the source value is not visible statically; set the value the running service uses
  RETAIL_CATALOG_SEARCH_OS_INDEX: "REQUIRED_CATALOG_ENV_RETAIL_CATALOG_SEARCH_OS_INDEX" # LITERAL: set the value the running service uses (not copied from the source)
---
apiVersion: v1
kind: Secret
metadata:
  name: catalog-secrets
type: Opaque
stringData:
  RETAIL_CATALOG_PERSISTENCE_ENDPOINT: "REQUIRED_CATALOG_SECRET_RETAIL_CATALOG_PERSISTENCE_ENDPOINT" # SECRET: the value comes from the secret named in applications/catalog.json (container environment RETAIL_CATALOG_PERSISTENCE_ENDPOINT); it is never in this file
  RETAIL_CATALOG_PERSISTENCE_PASSWORD: "REQUIRED_CATALOG_SECRET_RETAIL_CATALOG_PERSISTENCE_PASSWORD" # SECRET: the value comes from the secret named in applications/catalog.json (container environment RETAIL_CATALOG_PERSISTENCE_PASSWORD); it is never in this file
  RETAIL_CATALOG_PERSISTENCE_USER: "REQUIRED_CATALOG_SECRET_RETAIL_CATALOG_PERSISTENCE_USER" # SECRET: the value comes from the secret named in applications/catalog.json (container environment RETAIL_CATALOG_PERSISTENCE_USER); it is never in this file
  RETAIL_CATALOG_SEARCH_OS_PASSWORD: "REQUIRED_CATALOG_SECRET_RETAIL_CATALOG_SEARCH_OS_PASSWORD" # SECRET: the value comes from the secret named in applications/catalog.json (container environment RETAIL_CATALOG_SEARCH_OS_PASSWORD); it is never in this file
  RETAIL_CATALOG_SEARCH_OS_USERNAME: "REQUIRED_CATALOG_SECRET_RETAIL_CATALOG_SEARCH_OS_USERNAME" # SECRET: the value comes from the secret named in applications/catalog.json (container environment RETAIL_CATALOG_SEARCH_OS_USERNAME); it is never in this file
---
# TEMPLATE of the option federated_service_account of the task role module.retail_app_ecs.module.catalog_service.aws_iam_role.task_role: apply it only after the decision target.workload.identity
# is answered with that option (the draft then writes this ServiceAccount into the manifest itself). The annotation is the e-mail of the STACKIT
# service account of the role; the namespace is the one the manifests are applied into, and the federated identity provider trusts exactly it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: catalog
  labels:
    app.kubernetes.io/name: catalog
  annotations:
    workload-identity.stackit.cloud/service-account-email: REQUIRED_CATALOG_SERVICE_ACCOUNT_EMAIL
