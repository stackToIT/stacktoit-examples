kind: Job
metadata:
  name: migrate
  labels:
    app.kubernetes.io/name: migrate
spec:
  suspend: true
  completions: 1
  backoffLimit: 3 # Cloud Run retries a failed task 3 times by default (max_retries, the pinned Google provider documentation)
  template:
    metadata:
      labels:
        app.kubernetes.io/name: migrate
