name: Build and deploy the site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate examples (schema, manifest integrity, metadata cross-checks)
        run: python3 scripts/validate.py

      - name: Build the site
        run: python3 scripts/build-site.py --out _site

      - name: Validate the built site (report copy integrity, broken links)
        run: python3 scripts/validate.py --site _site

      - name: Reproducibility check (a second build must be identical)
        run: |
          python3 scripts/build-site.py --out _site2
          diff -r _site _site2
          rm -rf _site2

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
